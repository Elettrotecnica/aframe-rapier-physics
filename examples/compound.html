<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no,user-scalable=no,maximum-scale=1">
    <title>Examples • Compound RAPIER</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script type="module" src="../aframe-rapier.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.0/dist/aframe-environment-component.min.js"></script>
    <script src="../components/force-pushable.js"></script>
    <script src="../components/grab.js"></script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="text-overlay">
      <p>Various examples of compound shape.</p>
      <p>Click when the red reticle is over the sphere to apply a force to it.</p>
    </div>
    <a class="code-link"
       target="_blank"
       href="https://github.com/Elettrotecnica/aframe-rapier-physics/blob/main/examples/compound.html">
      view code
    </a>
    <a-scene environment rapier-physics="debug: true;">
      <a-assets>
        <a-asset id="lhand" src="https://cdn.aframe.io/controllers/hands/leftHandLow.glb"></a-asset>
        <a-asset id="rhand" src="https://cdn.aframe.io/controllers/hands/rightHandLow.glb"></a-asset>
      </a-assets>
      <!-- Player -->
      <a-entity camera look-controls wasd-controls position="0 1.6 0">
        <a-entity cursor
                  raycaster="objects:[force-pushable]"
                  position="0 0 -0.5"
                  geometry="primitive: circle; radius: 0.01; segments: 4;"
                  material="color: #FF4444; shader: flat"></a-entity>
      </a-entity>
      <a-entity id="left-hand"
                rapier-body="type: KinematicPositionBased;"
                rapier-shape="shape: Ball; fit: false; radius: 0.02; emitCollisionEvents: true"
                hand-controls="hand: left"
                grab
                >
      </a-entity>
      <a-entity id="right-hand"
                rapier-body="type: KinematicPositionBased;"
                rapier-shape="shape: Ball; fit: false; radius: 0.02; emitCollisionEvents: true"
                hand-controls="hand: right"
                grab
                >
      </a-entity>

      <!-- Terrain -->
      <a-box width="75" height="0.1" depth="75" rapier-body="type: Fixed" rapier-shape visible="false"></a-box>

      <a-entity position="-6 0 -2">
	<a-text
	  position="0 1.5 0"
	  value="Single primitive, multiple colliders"
	  align="center"
	  >
	</a-text>
	<a-sphere
	  position="0 4 0"
	  radius="0.25"
	  color="red"
          rapier-body
          rapier-shape__main="shape: Cylinder;
                              mass: 4;
                              fit: false;
                              halfExtents: 0.24 0.18 0.24;
                              radius: 0.25;
                              axis: y"
          rapier-shape__handle="shape: Cuboid;
                                mass: 1;
                                fit: false;
                                halfExtents: 0.15 0.18 0.04;
                                offset: 0.4 0 0;"
          force-pushable="force: 40"
	  >
	</a-sphere>
      </a-entity>

      <a-entity position="-1 0 -2">
	<a-text
	  position="0 1.5 0"
	  value="Multiple primitives, one collider"
	  align="center"
	  >
	</a-text>
	<a-entity
	  position="0 4 0"
	  rapier-body
	  rapier-shape="mass: 5"
	  force-pushable="force: 40"
	  >
          <a-cylinder
	    width="0.48"
	    height="0.36"
	    depth="0.48"
	    radius="0.25"
	    color="blue"
	    position="0 0 0">
	  </a-cylinder>
          <a-box
	    width="0.30"
	    height="0.36"
	    depth="0.08"
	    radius="0.25"
	    color="blue"
	    position="0.4 0 0">
	  </a-box>
	</a-entity>
      </a-entity>

      <a-entity position="4 0 -2">
	<a-text
	  position="0 1.5 0"
	  value="Multiple models, one hull collider"
	  align="center"
	  >
	</a-text>
	<a-entity
	  position="0 4 0"
	  scale="3 3 3"
          rapier-body
          rapier-shape="mass: 5"
          force-pushable="force: 40"
	  >
          <a-gltf-model
	    src="#lhand"
	    scale="1 1 1"
	    position="0 0 0"
	    >
	  </a-gltf-model>
          <a-gltf-model
	    src="#rhand"
	    scale="2 2 2"
	    position="0.5 0 0"
	    >
	  </a-gltf-model>
	</a-entity>
      </a-entity>

      <a-entity position="9 0 -2">
	<a-text
	  position="0 1.5 0"
	  value="Multiple models, one cuboid collider"
	  align="center"
	  >
	</a-text>
	<a-entity
	  position="0 4 0"
	  scale="3 3 3"
	  rapier-body
	  rapier-shape="shape: Cuboid; mass: 5"
	  rotation="90 45 60"
          force-pushable="force: 40"
	  >
          <a-gltf-model
	    src="#lhand"
	    scale="2 2 2"
	    position="0 0 0"
	    >
	  </a-gltf-model>
          <a-gltf-model
	    src="#rhand"
	    scale="1 1 1"
	    position="0.5 0 0"
	    >
	  </a-gltf-model>
	</a-entity>
      </a-entity>

      <a-entity position="14 0 -2">
	<a-text
	  position="0 1.5 0"
	  value="A primitive and a model in one cuboid collider."
	  align="center"
	  >
	</a-text>
	<a-entity
	  position="0 4 0"
	  rapier-body
	  rapier-shape="shape: Cuboid; mass: 5"
	  rotation="90 45 60"
          force-pushable="force: 40"
	  >
	  <a-sphere
	    radius="0.25"
	    color="green"
	    position="0.5 0 0"
	    >
	  </a-sphere>
          <a-gltf-model
	    src="#lhand"
	    position="0 0 0"
	    >
	  </a-gltf-model>
	</a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
